<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List - Futuriste</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Google - Space Grotesk (futuriste) -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      font-family: 'Space Grotesk', sans-serif;
    }

    body, html {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 25%, #151515 50%, #1a1a1a 75%, #0a0a0a 100%) !important;
      background-attachment: fixed !important;
    }

    /* Glassmorphism effect */
    .glass {
      background: rgba(20, 20, 25, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(200, 200, 200, 0.15);
    }

    /* Gradient animé */
    .gradient-animate {
      background: linear-gradient(45deg, #e5e7eb, #d1d5db, #e5e7eb);
      background-size: 300% 300%;
      animation: gradient 8s ease infinite;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glow effect */
    .glow {
      text-shadow: 0 0 20px rgba(229, 231, 235, 0.6);
      box-shadow: 0 0 30px rgba(229, 231, 235, 0.2), inset 0 0 20px rgba(229, 231, 235, 0.05);
    }

    /* Background animé */
    .bg-animated {
      background: linear-gradient(135deg, #0a0a15 0%, #1a0033 25%, #0d0025 50%, #1a0033 75%, #0a0a15 100%);
      background-size: 400% 400%;
      animation: bgShift 15s ease infinite;
      position: relative;
      overflow: hidden;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Grid background effect */
    .grid-bg {
      background-image: 
        linear-gradient(0deg, transparent 24%, rgba(200, 200, 200, 0.02) 25%, rgba(200, 200, 200, 0.02) 26%, transparent 27%, transparent 74%, rgba(200, 200, 200, 0.02) 75%, rgba(200, 200, 200, 0.02) 76%, transparent 77%, transparent),
        linear-gradient(90deg, transparent 24%, rgba(200, 200, 200, 0.02) 25%, rgba(200, 200, 200, 0.02) 26%, transparent 27%, transparent 74%, rgba(200, 200, 200, 0.02) 75%, rgba(200, 200, 200, 0.02) 76%, transparent 77%, transparent);
      background-size: 50px 50px;
    }

    /* Neon border */
    .neon-border {
      border: 2px solid transparent;
      background: linear-gradient(rgba(20, 20, 25, 0.7), rgba(20, 20, 25, 0.7)) padding-box,
                  linear-gradient(135deg, #e5e7eb, #d1d5db, #e5e7eb) border-box;
      transition: all 0.3s ease;
    }

    .neon-border:hover {
      box-shadow: 0 0 30px rgba(229, 231, 235, 0.3);
    }

    /* Button glow */
    .btn-glow {
      position: relative;
      background: linear-gradient(135deg, #e5e7eb, #d1d5db);
      color: #0a0a0a;
      transition: all 0.3s ease;
      border: 1px solid #a0aec0;
    }

    .btn-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(229, 231, 235, 0.3);
      border-color: #cbd5e1;
    }

    .btn-glow:active {
      transform: translateY(0);
    }

    /* Task item hover effect */
    .task-item {
      transition: all 0.3s ease;
      border-left: 3px solid transparent;
    }

    .task-item:hover {
      border-left-color: #a0aec0;
      box-shadow: inset 0 0 20px rgba(200, 200, 200, 0.08);
    }

    /* Checked animation */
    .task-done {
      opacity: 0.6;
    }

    .task-done .task-text {
      text-decoration: line-through;
      color: rgba(255, 255, 255, 0.4);
    }

    /* Input focus effect */
    input:focus {
      outline: none;
      box-shadow: 0 0 25px rgba(200, 200, 200, 0.4), inset 0 0 10px rgba(200, 200, 200, 0.1);
      border-color: rgba(200, 200, 200, 0.3);
    }

    /* Filter button active */
    .filter-btn.active {
      background: linear-gradient(135deg, #e5e7eb, #d1d5db);
      color: #0a0a0a;
      box-shadow: 0 0 25px rgba(229, 231, 235, 0.3);
      border-color: #cbd5e1;
    }

    /* Scroll animation */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .list-item {
      animation: slideIn 0.3s ease;
    }

    /* Error message */
    .error-shake {
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
  </style>
</head>
<body class="bg-animated grid-bg min-h-screen">
  
  <div class="min-h-screen flex items-center justify-center px-4 py-8">
    
    <div class="w-full max-w-2xl">
      
      <!-- Header avec glow -->
      <div class="text-center mb-8 md:mb-12">
        <h1 class="text-4xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-gray-200 via-gray-300 to-gray-200 glow mb-2 animate-pulse">
          TODO LIST
        </h1>
        <p class="text-gray-300/70 text-sm md:text-base">Gère tes tâches comme un dev</p>
      </div>

      <!-- Main Container avec glass effect -->
      <div class="glass rounded-2xl p-6 md:p-8 space-y-6 border-2 border-gray-600/20 bg-gradient-to-br from-slate-950/90 to-slate-900/90 backdrop-blur-xl">
        
        <!-- Input Section -->
        <div class="space-y-3">
          <div class="flex flex-col sm:flex-row gap-3">
            <input
              type="text"
              id="taskInput"
              placeholder="Qu'est-ce que tu dois faire ?"
              class="flex-1 px-4 py-3 md:py-4 bg-slate-950/60 text-gray-100 placeholder-gray-500 rounded-lg border border-gray-600/30 glass transition-all duration-300 text-sm md:text-base"
            />
            <button
              id="addBtn"
              class="btn-glow px-6 md:px-8 py-3 md:py-4 text-white font-semibold rounded-lg whitespace-nowrap text-sm md:text-base"
            >
              Ajouter
            </button>
          </div>
          <!-- Error message -->
          <p id="errorMsg" class="text-red-400 text-xs md:text-sm h-5 opacity-0 transition-opacity duration-300"></p>
        </div>

        <!-- Filter Buttons -->
        <div class="flex flex-wrap gap-2 md:gap-3 justify-center md:justify-start">
          <button
            data-filter="all"
            class="filter-btn active px-4 md:px-6 py-2 md:py-3 bg-gradient-to-r from-gray-300 to-gray-200 text-gray-900 font-semibold rounded-lg transition-all duration-300 text-xs md:text-sm hover:shadow-lg border border-gray-400"
          >
            Toutes
          </button>
          <button
            data-filter="active"
            class="filter-btn px-4 md:px-6 py-2 md:py-3 bg-slate-900/50 text-gray-300 font-semibold rounded-lg border border-gray-600/30 transition-all duration-300 hover:border-gray-600/60 text-xs md:text-sm"
          >
            En cours
          </button>
          <button
            data-filter="done"
            class="filter-btn px-4 md:px-6 py-2 md:py-3 bg-slate-900/50 text-gray-300 font-semibold rounded-lg border border-gray-600/30 transition-all duration-300 hover:border-gray-600/60 text-xs md:text-sm"
          >
            Terminées
          </button>
        </div>

        <!-- Task Counter -->
        <div class="flex justify-between items-center px-2 py-2 bg-slate-950/60 rounded-lg border border-gray-600/20">
          <p id="taskCount" class="text-gray-300/80 text-sm md:text-base">0 tâche</p>
          <button
            id="clearAllBtn"
            class="text-red-500/60 hover:text-red-500 text-xs md:text-sm transition-colors duration-200"
          >
            Tout supprimer
          </button>
        </div>

        <!-- Task List -->
        <div class="space-y-2 max-h-96 md:max-h-96 overflow-y-auto pr-2">
          <ul id="taskList" class="space-y-2">
            <!-- Les tâches apparaîtront ici -->
          </ul>
          <!-- Empty state -->
          <div id="emptyState" class="flex flex-col items-center justify-center py-12 opacity-60">
            <svg class="w-12 md:w-16 h-12 md:h-16 text-gray-500/40 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2m0 0l4-4m-4 4l-4-4m4 4v6m0 0v6m0-6h6m0 0h6m-6-6h6m-6-6h6" />
            </svg>
            <p class="text-gray-400/50 text-sm md:text-base">Pas de tâches... crée la première ! 🚀</p>
          </div>
        </div>

      </div>

      <!-- Footer -->
      <div class="text-center mt-8 opacity-50 text-xs md:text-sm text-gray-400/60">
        <p>Enregistrées automatiquement dans le navigateur 💾</p>
      </div>

    </div>

  </div>

  <!-- Script -->
  <script src="script.js"></script>

</body>
</html>
