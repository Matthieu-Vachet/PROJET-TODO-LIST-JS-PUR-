<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List - Futuriste</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-animated grid-bg">
    <div class="container-wrapper">
      <div class="container-max">
        <!-- Header avec glow -->
        <div class="header-section">
          <h1 class="header-title glow">TODO LIST</h1>
          <p class="header-subtitle">Gère tes tâches comme un dev</p>
        </div>

        <!-- Main Container avec glass effect -->
        <div class="main-container glass">
          <!-- Input Section -->
          <div>
            <div class="input-section">
              <input
                type="text"
                id="taskInput"
                placeholder="Qu'est-ce que tu dois faire ?"
                class="task-input glass"
              />
              <button
                id="addBtn"
                onclick="addEventListener('click', addTask)"
                class="btn-glow"
              >
                Ajouter
              </button>
            </div>
            <!-- Error message -->
            <p id="errorMsg"></p>
          </div>

          <!-- Filter Buttons -->
          <div class="filter-section">
            <button data-filter="all" class="filter-btn active">Toutes</button>
            <button data-filter="active" class="filter-btn">En cours</button>
            <button data-filter="done" class="filter-btn">Terminées</button>
          </div>

          <!-- Task Counter -->
          <div class="counter-section">
            <p id="taskCount" class="task-count">0 tâche</p>
            <button id="clearAllBtn" class="clear-all-btn">
              Tout supprimer
            </button>
          </div>

          <!-- Task List -->
          <div class="task-list-wrapper">
            <ul id="taskList">
              <!-- Les tâches apparaîtront ici -->
            </ul>
            <!-- Empty state -->
            <div id="emptyState" class="empty-state">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 12l2 2m0 0l4-4m-4 4l-4-4m4 4v6m0 0v6m0-6h6m0 0h6m-6-6h6m-6-6h6"
                />
              </svg>
              <p>Pas de tâches... crée la première ! 🚀</p>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="footer-section">
          <p>Enregistrées automatiquement dans le navigateur 💾</p>
        </div>
      </div>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
  </body>
</html>
